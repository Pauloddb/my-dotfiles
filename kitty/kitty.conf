# Fonte
font_family      Cascadia Code NF
bold_font        Cascadia Code NF
italic_font      Cascadia Code NF
bold_italic_font Cascadia Code NF
font_size        11.0

# Cursor
cursor #89e051
cursor_shape beam
cursor_blink_interval 0
cursor_trail 3

# Scroll
scrollback_lines 10000

# Aparência
background_opacity 0.95
confirm_os_window_close 0

# Desempenho
sync_to_monitor yes

# Posição: top ou bottom
tab_bar_edge bottom

# Estilo: fade, slant, separator, powerline (como tmux), etc.
tab_bar_style fade
# tab_fade 1

# Alinhamento
tab_bar_align center

# Cor de fundo
tab_bar_background #292d3e

# Fonte e tamanho
tab_bar_font_family Cascadia Code NF
# tab_bar_min_tabs 1

tab_title_template "{index}:{title}"
active_tab_title_template "<{index}:{title}>"

# BEGIN_KITTY_THEME
# Campbell
include current-theme.conf
# END_KITTY_THEME
